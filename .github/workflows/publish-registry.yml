name: Publish to MCP Registry

# Release by bumping "version" in package.json and server.json (the tests keep them in step), merging, then pushing a vX.Y.Z tag.
on:
  push:
    tags: ["v*"]

permissions: {}

# Publishes one version at a time; queue: max keeps every pending tag instead of replacing all but the newest.
concurrency:
  group: publish-registry
  cancel-in-progress: false
  queue: max

jobs:
  publish:
    name: Publish server.json
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # mcp-publisher signs in with GitHub's OIDC token, which proves the io.github.benjuntilla namespace
    env:
      MCP_PUBLISHER_VERSION: 1.8.1
      MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the tag matches server.json
        run: |
          expected="v$(jq -r .version server.json)"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match server.json version ($expected)"
            exit 1
          fi
      - name: Install mcp-publisher
        run: |
          curl -fsSL -o mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum --check --strict
          tar -xzf mcp-publisher.tar.gz mcp-publisher
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
