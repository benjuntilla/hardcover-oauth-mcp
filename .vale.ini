# Prose linting for the site's pages with Vale's standard style (Std): `mise run lint:prose`.
# `mise install` runs `vale sync`, which downloads Std into .vale/.
StylesPath = .vale
MinAlertLevel = suggestion
Packages = Std
# Words Std shouldn't flag, in .vale/config/vocabularies/Project/accept.txt: MIT is a name, not an acronym to spell out.
Vocab = Project

[*.md]
BasedOnStyles = Std
